aid: cala-health
name: Cala Health
description: 'Cala Health is a bioelectronic medicine company that develops wearable neuromodulation
  therapies for chronic disease. Its FDA-cleared Cala kIQ and Cala TRIO systems deliver TAPS
  (Transcutaneous Afferent Patterned Stimulation) therapy through a wrist-worn device that is
  physician-prescribed and clinically proven to reduce action hand tremors associated with
  essential tremor and Parkinson''s disease. Patients manage therapy and view results through
  the MyCala portal, and clinicians access data through the Cala 360 provider portal. Cala Health
  is a GV (Google Ventures) portfolio company operating in the life-sciences / medical-device
  sector. This profile currently exposes no public developer API; enrichment has captured the
  company''s public security, privacy, and support surface.'
